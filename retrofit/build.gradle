plugins {
  id 'java'
  id("net.ltgt.errorprone") version "2.0.1"
}

apply plugin: 'java-library'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'com.vanniktech.maven.publish'


repositories {
  mavenLocal()
  mavenCentral()
}


dependencies {
  api deps.okhttp

  compileOnly deps.android
  compileOnly deps.kotlinStdLib
  compileOnly deps.kotlinCoroutines

  compileOnly deps.animalSnifferAnnotations
  compileOnly deps.findBugsAnnotations

  testImplementation project(':retrofit:test-helpers')
  testImplementation deps.junit
  testImplementation deps.assertj
  testImplementation deps.guava
  testImplementation deps.mockwebserver
  testImplementation deps.kotlinStdLib
  testImplementation deps.kotlinCoroutines

  annotationProcessor "com.uber.nullaway:nullaway:0.10.8"
  annotationProcessor "edu.ucr.cs.riple.annotator:annotator-scanner:1.3.15"

  compileOnly "com.google.code.findbugs:jsr305:3.0.2"
  errorprone "com.google.errorprone:error_prone_core:2.3.2"
  errorproneJavac "com.google.errorprone:javac:9+181-r4173-1"
  compileOnly "com.uber.nullaway:nullaway-annotations:0.10.20"
}

import net.ltgt.gradle.errorprone.CheckSeverity
tasks.withType(JavaCompile) {
  // remove the if condition if you want to run NullAway on test code
  if (!name.toLowerCase().contains("test")) {
    options.errorprone.disableAllChecks = true
    options.errorprone.disableAllWarnings = true
    options.errorprone {
      check("NullAway", CheckSeverity.OFF)
      check("AnnotatorScanner", CheckSeverity.OFF)
      option("NullAway:AnnotatedPackages", "retrofit2")
      option("NullAway:SerializeFixMetadata", "true")
      option("NullAway:FixSerializationConfigPath", "/tmp/annotator/checker.xml")
      option("AnnotatorScanner:ConfigPath", "/tmp/annotator/scanner.xml")
    }
  }
  options.compilerArgs << "-Xmaxerrs" << "100000"
  options.compilerArgs << "-Xmaxwarns" << "100000"
}

jar {
  manifest {
    attributes  'Automatic-Module-Name': 'retrofit2'
  }
}
